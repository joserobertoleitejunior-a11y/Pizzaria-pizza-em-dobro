<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF9F1C">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🍕 Seu Pedido — Pizza em Dobro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0a0a0a;--card:#141414;--pr:#FF9F1C;--se:#e71d36;--ok:#2ecc71;--tx:#e8e8e8;--sub:#888;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:20px 16px 40px;}
.logo{text-align:center;font-size:1.1rem;font-weight:700;color:var(--pr);margin-bottom:18px;}

.cupom{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;margin-bottom:18px;}
.cupom-linha{display:flex;justify-content:space-between;font-size:.8rem;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
.cupom-linha:last-child{border-bottom:none;}
.cupom-total{font-weight:700;color:var(--pr);font-size:.95rem;}
.item-nome{font-size:.82rem;}
.item-sub{font-size:.65rem;color:var(--sub);margin-top:2px;}

.avaliacao{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;text-align:center;}
.avaliacao h3{font-size:.9rem;margin-bottom:12px;color:var(--tx);}
.stars{font-size:2rem;letter-spacing:6px;margin-bottom:14px;cursor:pointer;}
.stars span{color:#333;transition:.15s;}
.stars span.on{color:var(--pr);}
textarea{width:100%;background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;color:var(--tx);font-size:.8rem;min-height:70px;margin-bottom:12px;}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;font-weight:700;font-size:.85rem;cursor:pointer;background:var(--pr);color:#000;}
.ok-msg{color:var(--ok);font-size:.85rem;font-weight:700;padding:20px 0;}
.empty{text-align:center;color:var(--sub);font-size:.85rem;padding:40px 20px;}
</style>
</head>
<body>
<div class="logo">🍕 Pizza em Dobro</div>
<div id="conteudo"><div class="empty">Carregando seu pedido…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/utils.js"></script>
<script src="cupom.js"></script>
</body>
</html>
