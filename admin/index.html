<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07060a">
<title>Admin | Pizza em Dobro</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="../shared/app-clean.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/staff-auth.js"></script>
<script src="../shared/admin-api.js"></script>
</head>
<body>

<header class="topo">
  <div class="marca"><span class="ponto"></span>PIZZA EM DOBRO <em>ADMIN</em></div>
  <div class="topo-acoes">
    <a href="../caixa/" class="link-topo">Caixa</a>
    <a href="../caixa/?colar=1" class="link-topo">Conversor</a>
    <a href="../relatorios/" class="link-topo">Dashboard</a>
    <a href="../" class="link-topo">Loja</a>
    <button class="btn-sair" onclick="sairDaEquipe()">Sair</button>
  </div>
</header>

<nav class="abas" id="abas">
  <button data-aba="resumo" class="ativa">Resumo</button>
  <button data-aba="pedidos">Pedidos</button>
  <button data-aba="cardapio">Cardápio</button>
  <button data-aba="clientes">Clientes</button>
  <button data-aba="avaliacoes">Avaliações</button>
  <button data-aba="motoboys">Motoboys</button>
  <button data-aba="config">Configurações</button>
  <button data-aba="auditoria">Histórico</button>
</nav>

<main id="conteudo">
  <section id="aba-resumo" class="aba ativa"></section>

  <section id="aba-pedidos" class="aba">
    <div class="barra">
      <label>De <input type="date" id="ped-de"></label>
      <label>Até <input type="date" id="ped-ate"></label>
      <button class="btn" onclick="carregarPedidos()">Buscar</button>
    </div>
    <div id="lista-pedidos"></div>
  </section>

  <section id="aba-cardapio" class="aba">
    <div class="barra">
      <input type="search" id="card-busca" placeholder="Buscar sabor..." oninput="renderCardapio()">
      <button class="btn btn-vermelho" onclick="abrirItem()">+ Novo item</button>
    </div>
    <div id="lista-cardapio"></div>
  </section>

  <section id="aba-clientes" class="aba">
    <div class="barra"><input type="search" id="cli-busca" placeholder="Buscar por nome ou telefone..." oninput="renderClientes()"></div>
    <div id="lista-clientes"></div>
  </section>

  <section id="aba-avaliacoes" class="aba"><div id="lista-avaliacoes"></div></section>

  <section id="aba-motoboys" class="aba">
    <form class="cartao form-linha" onsubmit="salvarMotoboy(event)">
      <input type="hidden" id="mb-id">
      <input id="mb-nome" placeholder="Nome" required maxlength="60">
      <input id="mb-tel" placeholder="Telefone" inputmode="tel" maxlength="20">
      <input id="mb-taxa" type="number" step="0.01" min="0" placeholder="Taxa R$">
      <button class="btn">Salvar</button>
    </form>
    <div id="lista-motoboys"></div>
  </section>

  <section id="aba-config" class="aba">
    <form class="cartao" onsubmit="salvarConfig(event)">
      <h3>Loja</h3>
      <div class="grade" id="cfg-campos"></div>
      <div class="linha-check">
        <label><input type="checkbox" id="cfg-lojaFechada"> Loja fechada agora</label>
      </div>
      <button class="btn">Salvar configurações</button>
    </form>
    <form class="cartao" onsubmit="salvarSegredos(event)">
      <h3>Chaves de API (secretas)</h3>
      <p class="dica">As chaves nunca voltam pra tela depois de salvas. Deixe em branco pra manter a atual.</p>
      <div class="grade" id="seg-campos"></div>
      <button class="btn">Salvar chaves</button>
    </form>
  </section>

  <section id="aba-auditoria" class="aba"><div id="lista-auditoria"></div></section>
</main>

<div class="modal" id="modal-item" onclick="if(event.target===this)fecharItem()">
  <form class="modal-caixa" onsubmit="salvarItem(event)">
    <h3 id="item-titulo">Item do cardápio</h3>
    <div class="grade">
      <label>Número<input id="it-slug" type="number" min="1" required></label>
      <label>Categoria<select id="it-cat" required></select></label>
      <label class="larga">Nome<input id="it-nome" required maxlength="80"></label>
      <label class="larga">Descrição<textarea id="it-desc" maxlength="300" rows="3"></textarea></label>
      <label>Preço (R$)<input id="it-preco" type="number" step="0.01" min="0" required></label>
      <label class="check"><input type="checkbox" id="it-ativo" checked> Disponível</label>
    </div>
    <div class="modal-botoes">
      <button type="button" class="btn btn-contorno" onclick="fecharItem()">Cancelar</button>
      <button class="btn">Salvar</button>
    </div>
  </form>
</div>

<div id="aviso" class="aviso"></div>

<script src="admin.js?v=2"></script>
</body>
</html>
