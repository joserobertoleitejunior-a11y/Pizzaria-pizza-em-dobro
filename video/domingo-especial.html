<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza em Dobro — Domingo especial (historinha)</title>
<style>
@font-face{font-family:'Archivo Black';src:url(fontes/ArchivoBlack-Regular.ttf)}
@font-face{font-family:'Work Sans';src:url(fontes/WorkSans.ttf);font-weight:100 900}
:root{--ouro:#f5b800;--cor:#c8281f}*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;height:100%;overflow:hidden}
#palco{position:relative;width:1080px;height:1920px;background:#000;overflow:hidden;transform-origin:0 0;font-family:'Work Sans',sans-serif;color:#fff}
body.gravando #palco{transform:none!important}body.gravando #capa{display:none!important}
#baloes{position:absolute;inset:0;pointer-events:none;z-index:8}
.bal{position:absolute;width:max-content;max-width:640px;background:#fff;color:#141414;border:7px solid #141414;border-radius:44px;padding:20px 30px;font:800 54px/1.1 'Work Sans';text-align:center;box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.bal i{position:absolute;bottom:-34px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:34px solid #141414;margin-left:-22px}
.bal i::after{content:"";position:absolute;left:-14px;top:-40px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #fff}
#veu{position:absolute;left:0;right:0;bottom:0;height:640px;background:linear-gradient(transparent,rgba(0,0,0,.72));z-index:6}
#leg{position:absolute;left:50px;right:50px;top:1560px;height:300px;display:flex;flex-wrap:wrap;gap:6px 28px;justify-content:center;align-content:center;text-align:center;font:400 84px/1.05 'Archivo Black';text-transform:uppercase;text-shadow:0 5px 0 #000,0 0 22px #000;-webkit-text-stroke:2px #000;z-index:7}
#leg span{display:inline-block}
#tit{position:absolute;left:44px;top:60px;z-index:9}.cart{background:var(--ouro);color:#141414;border:6px solid #141414;padding:14px 24px;font:400 38px 'Archivo Black';text-transform:uppercase;box-shadow:7px 7px 0 #141414;transform:rotate(-2deg)}
#vhs{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.10) 0 3px,transparent 3px 9px),linear-gradient(rgba(40,60,120,.25),rgba(40,60,120,.25))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:10;pointer-events:none}
#fim{position:absolute;inset:0;display:none;z-index:6}
#fim .fbg{position:absolute;inset:0;background:url(../assets/fachada-fundo.jpg) center/cover}
#fim .fbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.1) 40%,rgba(0,0,0,.7))}
#fim .carimbo{position:absolute;left:50%;top:560px;width:640px;height:640px;margin-left:-320px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
#fim .onda{position:absolute;left:50%;top:880px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;border:8px solid rgba(255,255,255,.7)}
#fim .f1{position:absolute;left:0;right:0;top:230px;text-align:center;font:400 96px 'Archivo Black';color:var(--ouro);text-shadow:0 5px 0 #000,0 0 24px #000}
#fim .f2{position:absolute;left:60px;right:60px;top:360px;text-align:center;font:800 56px/1.15 'Work Sans';text-shadow:0 3px 14px #000}
#fim .url{position:absolute;left:0;right:0;top:1300px;text-align:center;font:400 50px 'Archivo Black';color:var(--ouro);text-shadow:0 3px 14px #000}
#fim .credito{position:absolute;left:0;right:0;bottom:46px;text-align:center;font:700 15px 'Work Sans';letter-spacing:3px;color:rgba(255,255,255,.75)}
#capa{position:fixed;inset:0;background:rgba(0,0,0,.85);color:#fff;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center;font:600 22px 'Work Sans';z-index:99}
#capa button{font:700 22px 'Work Sans';padding:16px 30px;border-radius:40px;border:0;background:#c8281f;color:#fff}
</style></head>
<body><div id="palco"></div>
<div id="capa"><div>Domingo especial · historinha</div><button id="btSom" type="button">▶ Assistir com áudio</button><button id="btMudo" type="button">Sem som</button></div>
<audio id="som" src="audio-domingo-especial.mp3" preload="auto"></audio>
<script src="stick.js"></script><script src="cenario-placeholder.js"></script><script src="historia.js"></script>
<script>
var andar=Stick.andar, F=2.3, TAU=Math.PI*2;
/* Página do ChatGPT (1024×1536, ampliada 2×). Quadros medidos em pixels da página 2048×3072. */
var Q={1:[52,54,1998,870],2:[52,914,922,1590],3:[966,914,1998,1590],4:[52,1636,1998,2380],5:[52,2430,988,3020],6:[1034,2430,1998,3020]};
var nada=function(){return {alfa:0};};
/* cavalete com a promoção (desenhado por código, preços do sistema) — fica no quadro 4 */
var cavalete='<g transform="translate(600,2342)"><path d="M-62 0 L-40 -210 L40 -210 L62 0" fill="none" stroke="#6b4a2b" stroke-width="12"/><rect x="-52" y="-200" width="104" height="150" rx="6" fill="#1d1f1c" stroke="#8a6238" stroke-width="8"/>'+
 '<text x="0" y="-162" text-anchor="middle" font-family="Archivo Black" font-size="27" fill="#f5b800">2 POR</text><text x="0" y="-122" text-anchor="middle" font-family="Archivo Black" font-size="34" fill="#fff">R$65</text>'+
 '<text x="0" y="-92" text-anchor="middle" font-family="Work Sans" font-weight="800" font-size="15" fill="#f5b800">3 PIZZAS =</text><text x="0" y="-72" text-anchor="middle" font-family="Work Sans" font-weight="800" font-size="15" fill="#fff">ENTREGA GRÁTIS</text></g>';
Historia.iniciar({
  pagina:{src:'cenarios/domingo-pagina.jpg',w:2048,h:3072},
  extras:cavalete,
  tempos:'tempos-domingo-especial.json',
  personagens:[
    {id:'ze',look:{camisa:'#2e7be6'}},
    {id:'lu',look:{uniforme:true,bone:true}}
  ],
  cenas:[
   /* GANCHO: começa pelo fim — Zé na avenida à noite com 3 caixas */
   {id:'h',painel:Q[6],gy:3000,esc:.44,congela:2.1,fala:'Como é que o Zé foi comprar UMA pizza… e voltou com TRÊS?',dest:['uma','três'],cam:[[1420,2740,1.25],[1360,2760,1.45]],
    ator:{ze:function(u,d,k){var p=andar(TAU*F*u,.6);p.x=1450-230*k;p.dir=-1;p.caixas=3;p.oD=70;p.eD=60;p.oE=70;p.eE=60;p.boca='preocupado';p.incl=Math.sin(u*5)*4;return p;},lu:nada},baloes:[]},
   /* rebobina a página até o 1º quadro */
   {id:'rw',rebobina:true,cartela:'⏪ 15 MINUTOS ANTES',fala:'',cam:[[1500,2760,1.2],[620,470,1.15]],escurece:0,ator:{ze:nada,lu:nada},baloes:[]},
   /* 1: a avenida real — barriga ronca, sente o cheiro */
   {id:'s1',painel:Q[1],gy:862,esc:.5,cartela:'Domingo, 18h',fala:'',cam:[[560,480,1.15],[700,500,1.3]],
    ator:{ze:function(u,d,k){var para=k>.45&&k<.7, p=andar(TAU*F*u,para?0:1);p.x=150+430*k;p.boca=para?'surpreso':'sorriso';if(para){p.cab=-10;p.olhar=4;}return p;},lu:nada},
    baloes:[{quem:'ze',t0:1.2,t1:3.2,txt:'Que cheiro é esse?!'}]},
   /* 3: chega na fachada (encaixe real na rua) */
   {id:'s2',painel:Q[3],gy:1468,esc:.3,fala:'',cam:[[1300,1250,1.35],[1540,1260,1.7]],
    ator:{ze:function(u,d,k){var p=andar(TAU*F*u,k<.85?1:0);p.x=1030+520*Math.min(1,k/.85);p.boca='sorriso';return p;},lu:nada},baloes:[]},
   /* 4: fachada de perto + cavalete com a promoção */
   {id:'s3',painel:Q[4],gy:2338,esc:.36,fala:'',cam:[[640,2050,1.3],[730,2080,1.65]],
    ator:{ze:function(u,d,k){var ch=Math.min(1,u/1.0), p=ch<1?andar(TAU*F*u):{};p.x=330+420*ch;if(ch>=1){p.cab=-8;p.olhar=-4;p.sobr=-8;p.boca=u<2.4?'surpreso':'aberta';p.oD=10;p.eD=12;p.oE=u>2.3?-30:5;p.eE=u>2.3?90:12;p.sobe=Math.sin(u*3)*4;p.dir=-1;}return p;},lu:nada},
    baloes:[{quem:'ze',t0:1.0,t1:2.4,txt:'Duas por R$ 65?!'},{quem:'ze',t0:2.5,t1:3.9,txt:'Com 3, entrega grátis?'}]},
   /* 5: na porta — a atendente Lu */
   {id:'s4',painel:Q[5],gy:2900,esc:.46,fala:'',cam:[[560,2720,1.45],[600,2740,1.75]],
    ator:{ze:function(u,d,k){return {x:820,y:2990,esc:1.1,dir:-1,sobr:-10,boca:u<2.6?'surpreso':'risada',olhar:-3,oD:8,eD:10,oE:8,eE:12};},
          lu:function(u,d,k){var w=Math.sin(u*9);return {x:430,boca:'sorriso',oD:10,eD:12,oE:150+12*w,eE:30+20*w,cab:4*Math.sin(u*3),sobe:Math.sin(u*3)*4};}},
    baloes:[{quem:'lu',t0:.3,t1:2.6,txt:'E aí, vai levar mais uma? Vai ser ótimo!'},{quem:'ze',t0:2.8,t1:4.6,txt:'Ah… então põe mais uma.'}]},
   /* 6: volta pra rua à noite com 3 caixas (fecha o gancho) */
   {id:'s5',painel:Q[6],gy:3000,esc:.44,corte:true,fala:'',cam:[[1420,2740,1.3],[1340,2760,1.4]],
    ator:{ze:function(u,d,k){var p=andar(TAU*F*u,.6);p.x=1470-280*k;p.dir=-1;p.caixas=3;p.oD=70;p.eD=60;p.oE=70;p.eE=60;p.boca=k<.5?'preocupado':'risada';p.incl=Math.sin(u*5)*4;return p;},lu:nada},
    baloes:[{quem:'ze',t0:.4,t1:2.2,txt:'Eu vim buscar UMA!'}]},
   /* a página inteira aparece (o “gibi” completo) */
   {id:'pg',fala:'',escurece:0,cam:[[1440,2760,1.1],[1024,1536,.527]],ator:{ze:nada,lu:nada},baloes:[]},
   {id:'fim',fim:true,f1:'DOMINGO ESPECIAL',f2:'Quem entra, não sai com uma só!',fala:'Pizza em Dobro. Quem entra, não sai com uma só.',dest:[],cam:[[1024,1536,.527],[1024,1536,.527]],ator:{},baloes:[]}
  ]});
</script></script></body></html>
