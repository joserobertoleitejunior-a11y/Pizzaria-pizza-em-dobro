<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="description" content="Como pedir pizza no site da Pizza em Dobro, em um minuto.">

</head>
<body>
<div id="palco">
  <div id="fundo"><img src="../assets/fachada-fundo.jpg" alt=""></div><div id="tinta"></div><div id="escuro"></div>
  <canvas id="part" width="1080" height="1920"></canvas>
  <div id="fone"><div id="ilha"></div><div id="tela"><iframe id="site" title="Site da Pizza em Dobro" src="about:blank"></iframe><div id="zap"></div><div id="brilho"></div></div></div>
  <div id="parte"></div>
  <div id="cap" aria-live="polite"></div>
  <div id="fim"></div>
  <div id="credito"><canvas id="cuboMini" width="200" height="200"></canvas><div><b>VIBE CODING PROCESS</b><span>(15) 99668-8070 · José Roberto</span></div></div>
  <div id="vinheta"></div><canvas id="grao" width="270" height="480"></canvas>
</div>
<div id="capa"><img src="../assets/logo.png" alt=""><h1>Como pedir na Pizza em Dobro</h1><p>Um minuto: promoções, combo, pedido e a mensagem chegando no WhatsApp. Formato Stories (1080×1920), com música.</p>
  <div><button id="btSom" type="button">▶ Assistir com música</button><button class="sec" id="btMudo" type="button">Sem som</button></div></div>
<div id="ctl"><button id="btRe" type="button">↺ Recomeçar</button></div>
<audio id="som" src="audio-como-pedir.mp3" preload="auto"></audio>
<script src="motion.js"></script>
<script>
Video.iniciar({
  tema:'whatsapp', tempos:'tempos-como-pedir.json',
  cenas:[
    {id:'splash',parte:'Abertura',html:'Bateu a <b>fome?</b> Vem ver!',fala:'Bateu a fome? Vem ver!',min:4.4,splash:true},
    {id:'hero',parte:'Abertura',html:'Peça pelo <b>site</b>, sem baixar nada',fala:'Peça pelo site, sem baixar nada!',rolar:{y:260}},
    {id:'promos',parte:'Promoções',html:'<b>Promoções</b> todo dia',fala:'Promoções todo dia!',rolar:{el:'promos',off:36}},
    {id:'entrega',parte:'Promoções',html:'Pediu 3 pizzas? <b>Entrega grátis</b>',fala:'Pediu três pizas? Entrega grátis!',rolar:{el:'entrega-gratis-card',off:150}},
    {id:'combo',parte:'Combo',html:'Monte o seu <b>combo</b>',fala:'Monte o seu combo!',rolar:{el:'combo-card-combo65',off:130}},
    {id:'sabores',min:3.8,parte:'Combo',html:'Escolha <b>2 sabores</b> e pronto',fala:'Escolha dois sabores, e pronto!',
      acoes:[{dt:.9,fn:function(w){w.comboToque('combo65','Mussarela');}},{dt:1.9,fn:function(w){w.comboToque('combo65','Calabresa');}},{dt:-.9,fn:function(w){w.comboAdicionar('combo65');}}]},
    {id:'cardapio',min:3.4,parte:'Cardápio',html:'Cardápio cheio de <b>sabor</b>',fala:'Cardápio cheio de sabor!',rolar:{el:'cat-p',off:60}},
    {id:'mais',min:3.4,parte:'Cardápio',html:'Toque no <b>+</b> e adicione',fala:'Toque no mais, e adicione!',rolar:{el:'@pizza',off:170},
      acoes:[{dt:-.7,fn:function(w){var m=w.eval('menu'),p=m.filter(function(x){return x.cat==='p'&&/frango catupiry/i.test(x.n);})[0]||m.filter(function(x){return x.cat==='p';})[0];w.addItem(p.id);}}]},
    {id:'carrinho',min:3.6,parte:'Pedido',html:'Confira o seu <b>pedido</b>',fala:'Confira o seu pedido!',
      acoes:[{dt:.1,fn:function(w){w.toggleCart({stopPropagation:function(){},target:{}});}}],rolagens:[{dt0:1.0,dt1:-.2,inner:'cart-bar',y:260}]},
    {id:'taxa',parte:'Pedido',html:'3 pizzas: <b>sem taxa</b> de entrega',fala:'Três pizas: sem taxa de entrega!'},
    {id:'dados',min:4.4,parte:'Pedido',html:'Preencha os seus <b>dados</b>',fala:'Preencha os seus dados!',
      rolagens:[{dt0:.1,dt1:1.0,inner:'cart-bar',y:620}],digitar:[{id:'u-name',texto:'Marcos',dt0:1.0,dt1:2.0},{id:'u-tel',texto:'(15) 99999-1234',dt0:2.1,dt1:3.4}],
      acoes:[{dt:-.3,fn:function(w,el){el('u-end').value='Rua XV de Novembro';el('u-num').value='120';}}]},
    {id:'pix',min:3.8,parte:'Pedido',html:'Escolha o <b>Pix</b> e envie',fala:'Escolha o Pix, e envie!',
      rolagens:[{dt0:.1,dt1:1.1,inner:'cart-bar',y:1100},{dt0:-1.3,dt1:-.2,inner:'cart-bar',y:5000}],acoes:[{dt:1.3,fn:function(w){w.escolherPagamento('Pix');}}]},
    {id:'zap1',parte:'WhatsApp',html:'O pedido chega no <b>WhatsApp</b>',fala:'O pedido chega no Uótsap!',zap:true},
    {id:'zap2',parte:'WhatsApp',html:'Pronto. <b>Rápido</b> assim.',fala:'Pronto. Rápido assim!',zap:true},
    {id:'local',parte:'Local',html:'Veja como <b>chegar</b>',fala:'Veja como chegar!',rolar:{el:'local-section',off:90},
      acoes:[{dt:0,fn:function(w){w.toggleCart({stopPropagation:function(){},target:{}});}}]},
    {id:'site',parte:'Local',html:'Site por <b>Vibe Coding Process</b>',fala:'Site feito pela Vibe Coding Process!',rolar:{y:'fim'}},
    {id:'fim',fim:true,tag:'Pedir pizza nunca foi tão fácil',fala:'Piza em Dobro. Pedir piza nunca foi tão fácil. Peça já, pelo site!'}
  ]
});
</script>

</html>
