<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza em Dobro — Como pedir (Stories)</title>
<meta name="description" content="Como pedir pizza no site da Pizza em Dobro, em um minuto.">
<link rel="stylesheet" href="motion.css">
</head>
<body>
<div id="palco">
  <div id="fundo"><img src="../assets/fachada-fundo.jpg" alt=""></div><div id="tinta"></div><div id="escuro"></div>
  <canvas id="part" width="1080" height="1920"></canvas>
  <div id="fone"><div id="ilha"></div><div id="tela"><iframe id="site" title="Site da Pizza em Dobro" src="about:blank"></iframe><div id="zap"></div><div id="brilho"></div></div></div>
  <div id="rail"><i></i></div>
  <div id="parte"></div>
  <div id="cap" aria-live="polite"></div>
  <div id="fim"></div>
  <div id="credito"><canvas id="cuboMini" width="200" height="200"></canvas><div><b>VIBE CODING PROCESS</b><span>(15) 99668-8070 · José Roberto</span></div></div>
  <div id="vinheta"></div><canvas id="grao" width="270" height="480"></canvas>
</div>
<div id="capa"><img src="../assets/logo.png" alt=""><h1>Como pedir na Pizza em Dobro</h1><p>Um minuto: promoções, combo, pedido e a mensagem chegando no WhatsApp. Formato Stories (1080×1920), com música.</p>
  <div><button id="btSom" type="button">▶ Assistir com música</button><button class="sec" id="btMudo" type="button">Sem som</button></div></div>
<div id="ctl"><button id="btRe" type="button">↺ Recomeçar</button></div>
<audio id="som" src="audio-como-pedir.mp3" preload="auto"></audio>
<script src="motion.js"></script>
<script>
Video.iniciar({
  tema:'whatsapp', tempos:'tempos-como-pedir.json',
  cenas:[
    {id:'splash',parte:'Abertura',html:'Bateu a <b>fome?</b> Vem ver!',fala:'Bateu a fome? Vem ver!',min:3.6,splash:true},
    {id:'promos',parte:'Promoções',html:'Vamos às <b>promoções</b>',fala:'Vamos às promoções!',rolar:{el:'promos',off:36}},
    {id:'ban2',parte:'Promoções',html:'Deslize e veja <b>mais promoções</b>',fala:'Deslize e veja mais promoções!',min:3.2,rolagens:[{dt0:.2,dt1:1.8,horiz:'promos-trilho',slide:1}]},
    {id:'ban1',parte:'Promoções',html:'Toque no banner das <b>pizzas</b>',fala:'Toque no banner das pitsas!',min:3.4,rolagens:[{dt0:.2,dt1:1.6,horiz:'promos-trilho',slide:0}],acoes:[{dt:-1.25,fn:function(w){VT.toque(w,0,1);}},{dt:-.85,fn:function(w){VT.toque(w,0,0);}}]},
    {id:'combo',parte:'Combo',html:'Direto no <b>combo</b>!',fala:'Direto no combo!',rolar:{el:'combo-card-combo65',off:130}},
    {id:'sabores',min:3.4,parte:'Combo',html:'Escolha <b>2 sabores</b>',fala:'Escolha dois sabores!',
      acoes:[{dt:.9,fn:function(w){w.comboToque('combo65','Mussarela');}},{dt:1.9,fn:function(w){w.comboToque('combo65','Calabresa');}},{dt:-.9,fn:function(w){w.comboAdicionar('combo65');}}]},
    {id:'cardapio',min:2.8,parte:'Cardápio',html:'Cardápio cheio de <b>sabor</b>',fala:'Cardápio cheio de sabor!',rolar:{el:'cat-p',off:60}},
    {id:'mais',min:2.8,parte:'Cardápio',html:'Toque no <b>+</b>',fala:'Toque no mais!',rolar:{el:'@pizza',off:170},
      acoes:[{dt:-.7,fn:function(w){var m=w.eval('menu'),p=m.filter(function(x){return x.cat==='p'&&/frango catupiry/i.test(x.n);})[0]||m.filter(function(x){return x.cat==='p';})[0];w.addItem(p.id);}}]},
    {id:'carrinho',min:3.2,parte:'Pedido',html:'Confira o <b>pedido</b>',fala:'Confira o pedido!',
      acoes:[{dt:.1,fn:function(w){w.toggleCart({stopPropagation:function(){},target:{}});}}],rolagens:[{dt0:1.0,dt1:-.2,inner:'cart-bar',y:260}]},
    {id:'dados',min:4.0,parte:'Pedido',html:'Preencha seus <b>dados</b>',fala:'Preencha seus dados!',
      rolagens:[{dt0:.1,dt1:1.0,inner:'cart-bar',y:620}],digitar:[{id:'u-name',texto:'Marcos',dt0:1.0,dt1:2.0},{id:'u-tel',texto:'(15) 99999-1234',dt0:2.1,dt1:3.4}],
      acoes:[{dt:-.3,fn:function(w,el){el('u-end').value='Rua XV de Novembro';el('u-num').value='120';}}]},
    {id:'pix',min:3.4,parte:'Pedido',html:'Escolha o <b>Pix</b> e envie',fala:'Escolha o Pix e envie!',
      rolagens:[{dt0:.1,dt1:1.1,inner:'cart-bar',y:1100},{dt0:-1.3,dt1:-.2,inner:'cart-bar',y:5000}],acoes:[{dt:1.3,fn:function(w){w.escolherPagamento('Pix');}}]},
    {id:'zap1',parte:'WhatsApp',html:'Chegou no <b>WhatsApp</b>!',fala:'Chegou no Uótsap!',zap:true,min:3.4},
    {id:'site',parte:'Local',html:'Site por <b>Vibe Coding Process</b>',fala:'Site feito pela Váib Côudim Prócess!',rolar:{y:'fim'},acoes:[{dt:0,fn:function(w){w.toggleCart({stopPropagation:function(){},target:{}});}}]},
    {id:'fim',fim:true,tag:'Pedir pizza nunca foi tão fácil',fala:'Pitsa em Dobro. Pedir pitsa nunca foi tão fácil!'}
  ]
});
</script>
</body>
</html>
