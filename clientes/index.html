<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clientes PED">
<meta name="theme-color" content="#FF9F1C">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🍕 Clientes — Pizza em Dobro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@300;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
:root{
  --bg:#07060a; --card:rgba(24,19,16,.55); --card-bd:rgba(255,159,28,.16);
  --pr:#FF9F1C; --se:#e71d36; --ok:#2ecc71; --tx:#f3ece2; --sub:#9c8f83;
  --font-display:'Bangers',cursive; --font-eyebrow:'Oswald',sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
body{
  background:var(--bg);color:var(--tx);font-family:var(--font-body);min-height:100vh;padding-bottom:30px;
  background-image:radial-gradient(circle at 15% -10%, rgba(255,159,28,.12) 0%, transparent 55%),
                    radial-gradient(circle at 100% 10%, rgba(231,29,54,.07) 0%, transparent 45%);
  background-attachment:fixed;
  word-break:break-word;overflow-wrap:break-word;
}

.nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;background:rgba(7,6,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--card-bd);
  flex-wrap:wrap;gap:8px;}
.nav-logo{font-family:var(--font-display);font-size:1.3rem;color:var(--pr);letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.nav-links a{font-family:var(--font-eyebrow);font-size:.62rem;letter-spacing:.6px;text-transform:uppercase;
  color:var(--sub);text-decoration:none;padding:6px 10px;border-radius:8px;
  border-top:2px solid transparent;transition:.2s;}
.nav-links a:hover{color:#000;background:var(--pr);border-top-color:transparent;}
.nav-links a.on{color:var(--tx);border-top:2px solid #fff;}

.search-box{padding:12px 16px;position:sticky;top:57px;background:var(--bg);z-index:90;}
.search-box input{width:100%;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--card-bd);border-radius:14px;padding:12px 14px;color:var(--tx);font-size:.85rem;}

.summary{display:flex;gap:10px;padding:0 16px 12px;}
.summary-item{flex:1;background:var(--card);backdrop-filter:blur(8px);border-radius:14px;padding:12px;text-align:center;border:1px solid var(--card-bd);}
.summary-num{font-family:var(--font-display);font-size:1.2rem;color:var(--pr);}
.summary-lbl{font-family:var(--font-eyebrow);font-size:.6rem;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

.list{padding:0 16px;}
.cli-card{display:flex;gap:12px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--card-bd);border-radius:16px;padding:13px 15px;margin-bottom:10px;cursor:pointer;}
.cli-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#FF9F1C,#E71D36);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.1rem;color:#000;flex:none;}
.cli-body{flex:1;min-width:0;}
.cli-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.cli-nome{font-size:.9rem;font-weight:700;}
.cli-badge{font-family:var(--font-eyebrow);font-size:.56rem;letter-spacing:.4px;padding:2px 9px;border-radius:10px;background:rgba(46,204,113,.15);color:var(--ok);text-transform:uppercase;flex:none;}
.cli-badge.novo{background:rgba(255,159,28,.15);color:var(--pr);}
.cli-meta{font-size:.7rem;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;}
.cli-login{display:inline-flex;align-items:center;gap:3px;}
.cli-stats{display:flex;gap:14px;margin-top:7px;font-size:.72rem;}
.cli-stats b{font-family:var(--font-display);color:var(--pr);}

.empty{text-align:center;color:#5a5049;padding:60px 20px;font-size:.85rem;}
.empty span{display:block;font-size:2rem;margin-bottom:12px;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#0d0b0e;border:1px solid var(--card-bd);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;}
.modal-close{float:right;color:var(--sub);font-size:1.3rem;cursor:pointer;}
.modal-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.modal-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#FF9F1C,#E71D36);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.5rem;color:#000;flex:none;}
.modal-info-row{font-size:.78rem;color:var(--sub);margin-bottom:3px;}
.modal-info-row b{color:var(--tx);}
.hist-row{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.78rem;display:flex;justify-content:space-between;gap:8px;}
.hist-row .d{color:var(--sub);font-size:.68rem;}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo"><img src="../assets/logo.png" alt="Pizza em Dobro" width="26" height="26" style="width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;flex:none;">Clientes</div>
  <div class="nav-links">
    <a href="../index.html">Loja</a>
    <a href="../relatorios/index.html">Dashboard</a>
    <a href="../caixa/index.html">Caixa</a>
    <a href="../clientes/index.html" class="on">Clientes</a>
    <a href="../bot-config/index.html">Bot</a>
  </div>
</div>

<div class="summary" id="summary"></div>

<div class="search-box">
  <input id="busca" placeholder="Buscar por nome ou telefone..." oninput="renderLista()">
  <div id="aviso-periodo" style="font-size:.65rem;color:var(--sub);margin-top:6px;">Mostrando clientes dos últimos 3 dias — busque por nome ou telefone para ver mais antigos</div>
</div>

<div class="list" id="lista"><div class="empty"><span>⏳</span>Carregando clientes…</div></div>

<div class="modal-bg" id="modal-hist">
  <div class="modal">
    <span class="modal-close" onclick="fecharHist()">✕</span>
    <div class="modal-header">
      <div class="modal-avatar" id="hist-avatar"></div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.1rem;color:var(--pr);" id="hist-nome"></div>
        <div class="modal-info-row" id="hist-login"></div>
      </div>
    </div>
    <div class="modal-info-row">📞 <b id="hist-tel">—</b></div>
    <div class="modal-info-row">✉️ <b id="hist-email">—</b></div>
    <div class="modal-info-row">🏠 <b id="hist-endereco">—</b></div>
    <a id="hist-whatsapp" href="#" target="_blank" style="display:none;align-items:center;gap:8px;background:#25D366;color:#fff;
      text-decoration:none;padding:10px 16px;border-radius:12px;font-weight:700;font-size:.82rem;margin-top:10px;">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="#fff"><path d="M16.001 3C9.107 3 3.5 8.607 3.5 15.5c0 2.316.63 4.484 1.726 6.35L3 29l7.35-2.188A12.44 12.44 0 0016 28c6.894 0 12.5-5.607 12.5-12.5S22.895 3 16.001 3zm0 22.7c-1.99 0-3.86-.55-5.46-1.51l-.39-.23-4.36 1.3 1.32-4.25-.25-.4a10.16 10.16 0 01-1.56-5.41c0-5.63 4.58-10.2 10.2-10.2 5.63 0 10.2 4.58 10.2 10.2 0 5.63-4.58 10.51-9.7 10.51zm5.6-7.63c-.31-.15-1.82-.9-2.1-1-.28-.1-.49-.15-.69.15-.2.31-.79 1-.97 1.2-.18.2-.36.23-.67.08-.31-.15-1.3-.48-2.47-1.53-.91-.81-1.53-1.82-1.71-2.13-.18-.31-.02-.47.13-.63.14-.14.31-.36.46-.54.15-.18.2-.31.31-.51.1-.2.05-.38-.02-.54-.08-.15-.69-1.67-.95-2.29-.25-.6-.5-.52-.69-.53h-.59c-.2 0-.54.08-.82.38-.28.31-1.08 1.05-1.08 2.57 0 1.51 1.1 2.97 1.26 3.18.15.2 2.17 3.31 5.25 4.65.73.32 1.31.5 1.75.64.74.24 1.41.2 1.94.12.59-.09 1.82-.74 2.08-1.46.26-.71.26-1.32.18-1.45-.07-.13-.28-.2-.59-.36z"/></svg>
      Chamar no WhatsApp
    </a>
    <div style="height:10px;"></div>
    <div id="hist-lista"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/staff-auth.js"></script>
<script>iniciarGateEquipe();</script>
<script src="../shared/utils.js"></script>
<script src="clientes.js"></script>
</body>
</html>
